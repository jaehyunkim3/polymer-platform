[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-platform"
version = "0.1.0"
description = "Polymer property prediction and experimental validation platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
core = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.6.0",
]
ai = [
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "rdkit>=2023.09.0",
]

[tool.setuptools]
packages = ["polymer_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
